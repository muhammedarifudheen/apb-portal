<meta name="referrer" content="no-referrer">

<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>

<body>
<style>
/* The dashboard's first look: dark navy panels, green for on-time. The first rule keeps the dashboard's own colour
   names; the second gives the same colours to the names its markup and the sign-in page refer to. */
:root{color-scheme:dark;--bg:#0b1220;--panel:#131c2e;--panel2:#182238;--line:#233047;--txt:#e8eef8;--mut:#93a4c0}
:root{--page:#0b1220;--surface:#131c2e;--inset:#182238;--rule:#233047;--rule-2:#33507a;--ink:#e8eef8;--ink-2:#c7d3e8;
 --accent:#2563eb;--accent-on:#fff;--focus:#3b82f6;
 --b1:#15803d;--b2:#22c55e;--b3:#eab308;--b4:#f97316;--b5:#dc2626;
 --b1-ink:#15803d;--b2-ink:#22c55e;--b3-ink:#eab308;--b4-ink:#f97316;--b5-ink:#dc2626;
 --b1-on:#fff;--b2-on:#fff;--b3-on:#fff;--b4-on:#fff;--b5-on:#fff;
 --ok:#22c55e;--ok-ink:#22c55e;--wv:#3b82f6;--wv-ink:#3b82f6;--lt:#ef4444;--lt-ink:#ef4444;
 --ok-text:#86efac;--wv-text:#93c5fd;--lt-text:#fca5a5}
html.locked,html.locked body{height:100%}
html{background:#0b1220}
body{min-height:100%}
#gate,.gate-session,.gate-admin,.gate-up{line-height:1.45}
#gate{font-size:14px}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#0b1220,#0e1626);color:var(--txt);
 font-family:'Segoe UI',Inter,-apple-system,Roboto,Arial,sans-serif}
.wrap{max-width:1760px;margin:0 auto;padding:26px 22px 64px}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;
 padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:22px}
h1{margin:0;font-size:27px;letter-spacing:-.4px}
h1 span{color:#22c55e}
.sub{color:var(--mut);font-size:13px;margin-top:6px}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:8px 15px;font-size:12px;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 17px;position:relative;overflow:hidden}
.kpi:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--bc)}
.kpi-l{font-size:11.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--mut);font-weight:600}
.kpi-v{font-size:29px;font-weight:700;margin:7px 0 4px;letter-spacing:-.6px}
.kpi-s{font-size:11.5px;color:var(--mut);line-height:1.45}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:22px}
.panel h2{margin:0 0 4px;font-size:16px;letter-spacing:-.2px}
.panel .hint{color:var(--mut);font-size:12.4px;margin-bottom:14px;line-height:1.55}
.grid2{display:grid;grid-template-columns:1.05fr 1fr;gap:16px;margin-bottom:22px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:12.8px}
th{text-align:left;color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.7px;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid rgba(35,48,71,.6)}
tr.tot td{font-weight:700;border-top:1px solid var(--line)}
.dot{width:11px;height:11px;border-radius:3px;display:inline-block;vertical-align:middle}

/* ---- banded chart ---- */
.chartwrap{position:relative}
#bandbars{height:300px}
.bandgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:0;padding-left:56px;padding-right:10px;margin-top:8px}
.bcol{border-top:4px solid var(--bc);padding:0 6px 6px 6px;min-width:0}
.bhead{padding:9px 4px 8px}
.bname{font-size:13.5px;font-weight:700;color:var(--txt);display:flex;align-items:center;gap:7px}
.bname:before{content:'';width:11px;height:11px;border-radius:3px;background:var(--bc);flex:0 0 auto}
.bmeta{font-size:11.3px;color:var(--mut);margin-top:5px;line-height:1.5}
.bmeta b{color:var(--txt)}
.bnote{font-size:10.6px;color:var(--bc);margin-top:4px;font-weight:600;letter-spacing:.2px}
.blist{max-height:440px;overflow-y:auto;overflow-x:hidden;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:4px;scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:#3f6399 #0f1728}
.blist::-webkit-scrollbar{width:11px}
.blist::-webkit-scrollbar-track{background:#0f1728;border-radius:9px;margin:3px 0}
.blist::-webkit-scrollbar-thumb{background:#3f6399;border-radius:9px;border:2px solid #0f1728}
.blist::-webkit-scrollbar-thumb:hover{background:#5b86c4}
.nm{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;font-size:10.9px;line-height:1.3;border-left:3px solid var(--bc);margin:2px 0}
.nm:nth-child(odd){background:rgba(255,255,255,.028)}
.nm .tx{flex:1 1 auto;min-width:0;color:#dbe6f7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm .pv{flex:0 0 auto;font-weight:700;font-size:10.4px;color:#fff;background:var(--bc);border-radius:5px;padding:1px 5px}
.bfoot{font-size:10.5px;color:var(--mut);text-align:center;padding:6px 0 2px}
.nm.hit{background:rgba(59,130,246,.20);box-shadow:inset 0 0 0 1px rgba(59,130,246,.55)}
.badge{display:none;align-items:center;gap:7px;font-size:11.6px;color:#bfdbfe;
 background:rgba(59,130,246,.14);border:1px solid rgba(59,130,246,.45);border-radius:999px;
 padding:6px 13px;margin:-4px 0 12px;width:fit-content}
.badge:before{content:'';width:8px;height:8px;border-radius:50%;background:#3b82f6}
.acwrap{position:relative;flex:1 1 330px;min-width:250px}
.acwrap input{width:100%;min-width:0}
.ac{display:none;position:absolute;z-index:60;top:calc(100% + 6px);left:0;right:0;max-height:286px;
 overflow-y:auto;background:#0f1728;border:1px solid #33507a;border-radius:10px;
 box-shadow:0 16px 38px rgba(0,0,0,.6);padding:4px}
.aci{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;cursor:pointer;font-size:12.4px}
.aci:hover,.aci.on{background:rgba(59,130,246,.2)}
.aci .dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.acin{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#e3ecfa}
.acid{flex:0 0 auto;color:#7d90ad;font-size:11px}
.acv{flex:0 0 auto;font-weight:700;font-size:11px;color:#cbd9ee}
.letters{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 15px}
.lt{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;
 padding:6px 10px;font-size:12.2px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.lt span{font-size:10.4px;color:var(--mut);font-weight:600}
.lt:hover{border-color:#3b82f6}
.lt.active{background:rgba(59,130,246,.22);border-color:#3b82f6;color:#fff}
.lt.active span{color:#cfe0fb}
.dhead{font-size:13px;color:#cbd9ee;margin:2px 0 10px}
.dhead b{color:#fff}
.dscroll{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.dtab{width:100%;border-collapse:collapse;font-size:12.4px}
.dtab th{position:sticky;top:0;background:#16223a;z-index:2}
.dtab td{white-space:nowrap}
.dtab tr:hover td{background:rgba(59,130,246,.1)}
.dempty{font-size:12.6px;color:#f0a5a5;background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.35);
 border-radius:10px;padding:12px 14px}
.mtab td{white-space:normal}
.mbarwrap{display:inline-block;width:80px;height:7px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;vertical-align:middle}
.mbar{height:100%;border-radius:4px}
.yrrow td{background:rgba(59,130,246,.08);color:#8fb4e8;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:6px 12px;border-bottom:1px solid rgba(59,130,246,.25)}
.card{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:14px}
.f{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.f .k{font-size:10.6px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut);font-weight:600}
.f .v{font-size:15px;font-weight:700;margin-top:4px;color:#fff;word-break:break-word}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle;margin-right:6px}
.nm{cursor:pointer}
.nm:hover{background:rgba(59,130,246,.16);box-shadow:inset 0 0 0 1px rgba(59,130,246,.45)}
.nm.sel{background:rgba(59,130,246,.3);box-shadow:inset 0 0 0 1px #3b82f6}
.expand .blist{max-height:none}
.controls{display:flex;gap:11px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.controls input{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:9px 12px;font-size:13px;outline:none;min-width:260px}
.controls input:focus,.controls select:focus{border-color:#3b82f6}
.controls select{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
 border-radius:9px;padding:9px 12px;font-size:13px;outline:none}
.controls button{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:9px 14px;font-size:12.5px;cursor:pointer}
.controls button:hover{border-color:#3b82f6}
.count{font-size:12px;color:var(--mut);margin-left:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:14px;font-size:12px;color:var(--mut)}
.chip{display:inline-flex;align-items:center;gap:6px}
footer{color:var(--mut);font-size:11.5px;text-align:center;margin-top:26px;line-height:1.7}
.mutn{font-weight:400;color:var(--mut)}
.cg{color:#22c55e;font-weight:700}.cb{color:#3b82f6;font-weight:700}.cr{color:#ef4444;font-weight:700}
.mini{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:5px 11px;font-size:11.5px;cursor:pointer;margin-left:8px}
.mini:hover{border-color:#3b82f6}
.mini.pri{background:#2563eb;border-color:#2563eb;color:#fff;font-weight:700}
.lnk{color:#60a5fa;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.lnk.sm{font-size:11px;margin-left:6px;color:#8fb4e8}
.lnk:hover{color:#93c5fd}
.dscroll.tall{max-height:600px}
.mtab td small{color:var(--mut);font-size:11px;margin-left:4px}
.mtab .mrow{cursor:pointer}
.mtab .mrow td{border-bottom:none;padding-bottom:4px}
.mtab .wkrow td{padding:2px 12px 12px;border-bottom:1px solid rgba(35,48,71,.8);background:rgba(255,255,255,.012)}
.mtab.hidewk .wkrow,.mtab .wkrow.closed{display:none}
.mtab .totrow td{font-weight:700;border-top:2px solid var(--line);background:#16223a}
.wks{display:flex;flex-wrap:wrap;gap:6px}
.wk{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:4px 9px;font-size:11.4px;border:1px solid;white-space:nowrap}
.wk i{font-style:normal;font-size:10.4px;opacity:.75}
.wk.ok{background:rgba(34,197,94,.09);border-color:rgba(34,197,94,.35);color:#86efac}
.wk.wv{background:rgba(59,130,246,.13);border-color:rgba(59,130,246,.55);color:#93c5fd}
.wk.lt{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.55);color:#fca5a5}
.sbar{display:inline-flex;width:110px;height:8px;border-radius:4px;overflow:hidden;background:rgba(255,255,255,.08);vertical-align:middle}
.sbar i{display:block;height:100%}
.sumstrip{display:flex;flex-wrap:wrap;gap:10px;margin:2px 0 14px}
.sc{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 13px;min-width:112px}
.sc em{display:block;font-style:normal;font-size:10.3px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut);font-weight:600}
.sc b{display:block;font-size:16px;margin-top:3px;color:#fff}
.sc small{display:block;color:var(--mut);font-size:10.8px;margin-top:1px}
.kpi.wide{grid-column:span 2}
@media(max-width:640px){.kpi.wide{grid-column:span 1}}
.yr-block{margin-bottom:22px}
.yr-block:last-child{margin-bottom:0}
.yr-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:9px 14px;border-radius:10px;background:linear-gradient(90deg,rgba(59,130,246,.16),rgba(59,130,246,.03));border:1px solid rgba(59,130,246,.35);margin-bottom:10px}
.yr-head b{font-size:14.5px;color:#dbe9ff}
.yr-head .yr-sub{font-size:11.6px;color:var(--mut)}
.yr-tag{font-size:10.3px;text-transform:uppercase;letter-spacing:.6px;background:rgba(59,130,246,.22);color:#93c5fd;border-radius:999px;padding:2px 9px;font-weight:700}
.mo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:9px}
.mo-card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer;transition:border-color .12s}
.mo-card:hover{border-color:#3b82f6}
.mo-card.open{border-color:#3b82f6;background:rgba(59,130,246,.08)}
.mo-top{display:flex;justify-content:space-between;align-items:baseline}
.mo-top b{font-size:13px}
.mo-top span{font-size:12px;font-weight:700}
.mo-ring{height:6px;border-radius:3px;background:rgba(255,255,255,.09);overflow:hidden;margin:6px 0 7px;display:flex}
.mo-ring i{display:block;height:100%}
.mo-nums{display:flex;gap:7px;font-size:10.6px;flex-wrap:wrap}
.mo-nums em{font-style:normal}
.mo-expand{grid-column:1/-1;background:rgba(255,255,255,.02);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;margin-top:2px}
.wkline{display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.05);font-size:12.3px;flex-wrap:wrap}
.wkline:last-child{border-bottom:none}
.wkline .wl-l{min-width:210px;color:var(--mut)}
.wkline .wl-l b{color:var(--txt);font-weight:600}
.wkline .pill{border-radius:999px;padding:2px 10px;font-size:11px;font-weight:700;white-space:nowrap}
.pill.ok{background:rgba(34,197,94,.14);color:#86efac}
.pill.wv{background:rgba(59,130,246,.16);color:#93c5fd}
.pill.lt{background:rgba(239,68,68,.15);color:#fca5a5}
.wkline .wl-amt{margin-left:auto;font-size:11.6px;color:var(--mut);text-align:right}
.mo-total{display:flex;gap:14px;flex-wrap:wrap;font-size:11.8px;color:var(--mut);margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.mo-total b{color:var(--txt)}
.trendup{color:#22c55e}.trenddown{color:#ef4444}.trendflat{color:var(--mut)}
.flagbox{display:inline-flex;align-items:center;gap:6px;background:rgba(234,179,8,.14);border:1px solid rgba(234,179,8,.4);color:#fde68a;border-radius:8px;padding:5px 10px;font-size:11.8px;margin-top:4px}
.paretobox{position:relative;width:100%;margin-bottom:10px}
.paretoline{font-size:12.5px;color:var(--mut);margin-bottom:10px}
.paretoline b{color:#fff}
#exportBtn{margin-left:8px}
.srcbadge{display:inline-flex;align-items:center;gap:6px;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.35);color:#93c5fd;border-radius:999px;padding:4px 11px;font-size:11.3px;margin-top:10px}
#watchBtn{white-space:nowrap}
#watchBtn.on{background:#dc2626;border-color:#dc2626;color:#fff;font-weight:700}
.tscroll{overflow-x:auto}
.grid2>*{min-width:0}
.controls select{max-width:100%}
.kpi-v.amt{font-size:25px}
@media(max-width:760px){.bandgrid{grid-template-columns:1fr;padding-left:0;padding-right:0;gap:12px}.wkline .wl-l{min-width:0}.controls input{min-width:0}}

/* ---- sign-in ---- */
#gate{min-height:100%;display:grid;place-items:center;padding:32px 16px}
#gate .g-card{width:100%;max-width:404px;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.45)}
#gate .g-bands{display:grid;grid-template-columns:repeat(5,1fr);height:6px}
#gate .g-bands i:nth-child(1){background:var(--b1)}
#gate .g-bands i:nth-child(2){background:var(--b2)}
#gate .g-bands i:nth-child(3){background:var(--b3)}
#gate .g-bands i:nth-child(4){background:var(--b4)}
#gate .g-bands i:nth-child(5){background:var(--b5)}
#gate .g-body{padding:28px 28px 24px;display:flex;flex-direction:column;gap:18px}
#gate .g-head{display:flex;flex-direction:column;gap:6px}
#gate .g-eyebrow{margin:0;font-size:11.5px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;color:var(--mut)}
#gate h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.4px;line-height:1.2}
#gate .g-lede{margin:0;font-size:13.5px;color:var(--mut)}
#gate form{display:flex;flex-direction:column;gap:14px}
#gate .g-field{display:flex;flex-direction:column;gap:6px}
#gate label{font-size:12px;font-weight:600;color:var(--ink-2)}
#gate input{width:100%;min-width:0;font:inherit;font-size:15px;color:var(--txt);background:#0b1220;border:1px solid #2b3a55;border-radius:9px;padding:11px 12px;outline:none}
#gate input:focus-visible{border-color:var(--focus);box-shadow:0 0 0 3px rgba(59,130,246,.25)}
#gate .g-pw{position:relative;display:flex}
#gate .g-pw input{padding-right:66px}
#gate #gate-show{position:absolute;right:6px;top:50%;transform:translateY(-50%);font:inherit;font-size:12px;font-weight:600;color:var(--mut);background:transparent;border:0;border-radius:6px;padding:6px 9px;cursor:pointer}
#gate #gate-show:hover{color:var(--txt)}
#gate #gate-show:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
#gate #gate-msg{margin:0;min-height:20px;font-size:13px;line-height:1.45;color:#fca5a5}
#gate #gate-msg.info{color:var(--mut)}
#gate #gate-submit{font:inherit;font-size:15px;font-weight:700;color:#06210f;background:#22c55e;border:0;border-radius:9px;padding:12px 16px;cursor:pointer}
#gate #gate-submit:hover{background:#34d36c}
#gate #gate-submit:focus-visible{outline:2px solid #fff;outline-offset:2px}
#gate #gate-submit:disabled{opacity:.55;cursor:default;background:#22c55e}
#gate .g-note{margin:0;padding-top:16px;border-top:1px solid var(--line);font-size:12px;line-height:1.6;color:var(--mut)}
@media (max-width:420px){ #gate .g-body{padding:22px 20px 20px} }

/* ---- signed-in bar, admin panels ---- */
.gate-session{display:flex;justify-content:flex-end;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;font-size:12.5px;color:var(--mut)}
.gate-session b{color:var(--txt);font-weight:600}
.gate-session .gate-scope{margin-right:auto;color:var(--txt);background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--b2);border-radius:8px;padding:6px 13px;font-weight:600}
.gate-session .gate-scope.limited{border-left-color:var(--b3)}
.gate-session button{font:inherit;font-weight:600;color:var(--txt);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 15px;cursor:pointer}
.gate-session button:hover{border-color:var(--focus)}
.gate-session button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.gate-session .gate-upload{color:#fff;background:#2563eb;border-color:#2563eb;font-weight:700}
.gate-session .gate-upload:hover{background:#3b82f6;border-color:#3b82f6}
.gate-admin{margin-bottom:22px;background:var(--panel);border:1px solid var(--line);border-radius:14px}

<script>
(function(){
  'use strict';
  var USERS = JSON.parse(document.getElementById('gate-users').textContent);
  var META = JSON.parse(document.getElementById('gate-meta').textContent);
  
  /* Data engine of the dashboard: reads an Excel/CSV file, works out every agent's payment record,
   and fills the dashboard template. No DOM access; the same code runs in the page and in tests. */
var CORE = (function(){
  'use strict';
  var BANDS = [
    {key: 'Perfect (0 delays)', color: '#15803d', role: 'Best — never late', rule: [100, 100]},
    {key: 'Excellent', color: '#22c55e', role: 'Very good', rule: [90, 100]},
    {key: 'Good', color: '#eab308', role: 'Acceptable', rule: [70, 90]},
    {key: 'Needs Improvement', color: '#f97316', role: 'Watch list', rule: [40, 70]},
    {key: 'Poor / Habitual Delayer', color: '#dc2626', role: 'Worst — habitual delayer', rule: [0, 40]}];
  var AGENT_CATEGORIES = ['Non Iata Agents', 'Iata Agents', 'Online Agents', 'Direct Customers', 'GROUPS', 'Iata Agents (Special)', 'RAF Exemption'];
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var WEEKNO = {firstweek: 1, secondweek: 2, thirdweek: 3, fourthweek: 4, fifthweek: 5, sixthweek: 6};
  var REQUIRED = ['FromDate', 'ToDate', 'SettlementDate', 'ClientID', 'ClientName', 'Category', 'Sales', 'Balance'];

  /* ---------- number formatting that matches the figures already published ---------- */
  function fixed(x, d){                       /* round half to even on the exact value, like the original report */
    var s = x.toFixed(d), full = x.toFixed(Math.min(100, d + 60)), dot = full.indexOf('.');
    if(/^50*$/.test(full.slice(dot + 1 + d))){
      var cut = full.slice(0, dot + 1 + d); if(d === 0) cut = cut.slice(0, -1);
      if('02468'.indexOf(cut.charAt(cut.length - 1)) >= 0) s = cut;
    }
    return s === '-0' || /^-0\.0+$/.test(s) ? s.slice(1) : s;
  }

ion value=\"\">All sales persons<\/option><\/select>\n      <select id=\"fac\"><option value=\"\">All accountants<\/option><\/select>\n      <select id=\"frep\"><option value=\"\">All sales reps<\/option><\/select>\n      <button id=\"watchBtn\" class=\"mini\" title=\"Poor or Needs-Improvement agents that are currently mid-delay-streak or flagged for the waiver pattern\">⚑ Watchlist only<\/button>\n      <button id=\"clear\">Clear search<\/button>\n      <button id=\"exportBtn\" class=\"mini pri\">Export visible agents (CSV)<\/button>\n      <span class=\"count\" id=\"count\"><\/span>\n    <\/div>\n@@LETTERS@@\n    <div class=\"jumpline\" id=\"jump\" hidden><button type=\"button\" class=\"mini pri\" id=\"jumpBtn\"><\/button><\/div>\n  <\/div>\n\n  <div class=\"panel\" id=\"bandpanel\">\n    <div class=\"phead\">\n      <h2>Banded Bar Chart — Agents per Reliability Band (with every agent name underneath)<\/h2>\n      <label class=\"monthpick\" for=\"monthSel\">Month <select id=\"monthSel\"><option value=\"\">All months<\/option><\/select><\/label>\n    <\/div>\n    <div class=\"hint\">\n      Each bar = one reliability band; bar height = how many agents fall in it; bar colour runs the green→red scale.\n      <b>Directly under each bar<\/b> is the full list of that band's agents, aligned in the same column. Each column has its own scrollbar — scroll inside a column to read all of its names, or press the button to expand every list at once. The search panel just above drives these bars and columns. Use the <b>Month<\/b> filter at the top right to band every agent on one month's settlement weeks only. <b>Click any agent name<\/b> to open its details just below this chart.\n    <\/div>\n    <div class=\"controls\">\n      <button id=\"toggle\">Expand all names (no inner scroll)<\/button>\n    <\/div>\n    <div class=\"badge\" id=\"badge\"><\/div>\n    <div class=\"chartwrap\"><canvas id=\"bandbars\" role=\"img\" aria-label=\"Bar chart of the number of agents in each reli ? ' · bars show matching agents only' : ''))\n    : 'Filtered view — bars below show matching agents only';\n\n  bandChart.data.datasets[0].data = ORDER.map(function(k){ return perBand[k]; });\n  bandChart.update('none');\n\n  renderDetail(active);\n  buildAC();\n}\n\n/* ---- events ---- */\nq.addEventListener('input', function(){ acIdx = -1; applyFilter(); });\nq.addEventListener('keydown', function(e){\n  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){\n    if(!acList.length) return;\n    e.preventDefault();\n    acIdx = e.key === 'ArrowDown' ? (acIdx + 1) % acList.length\n                                 : (acIdx <= 0 ? acList.length - 1 : acIdx - 1);\n    buildAC();\n    const on = acBox.querySelector('.aci.on');\n    if(on) on.scrollIntoView({block:'nearest'});\n  } else if(e.key === 'Enter'){\n    if(acIdx >= 0){ e.preventDefault(); pick(acIdx); }\n  } else if(e.key === 'Escape'){\n    acBox.style.display = 'none';\n    resetFilters();\n    applyFilter();\n  }\n});\nacBox.addEventListener('mousedown', function(e){\n  const it = e.target.closest('.aci');\n  if(it) { e.preventDefault(); pick(parseInt(it.dataset.i, 10)); }\n});\nacBox.addEventListener('mousemove', function(e){\n  const it = e.target.closest('.aci');\n  if(it){\n    const i = parseInt(it.dataset.i, 10);\n    if(i !== acIdx){ acIdx = i; buildAC(); }\n  }\n});\ndocument.addEventListener('click', function(e){\n  if(!e.target.closest('.acwrap')) acBox.style.display = 'none';\n});\n[sg, ct, fsp, fac, frep].forEach(function(el){\n  el.addEventListener('input', applyFilter);\n  el.addEventListener('change', applyFilter);\n});\ndocument.querySelectorAll('#letters .lt').forEach(function(b){\n  b.addEventListener('click', function(){\n    document.querySelectorAll('#letters .lt').forEach(function(x){ x.classList.remove('active'); });\n    b.classList.add('active');\n    letterVal = b.dataset.lt;\n    applyFilter();\n  });\n});\ndocument.getElementById('clear').addEventListener('click', function(){\n  rese   }
  function ghMessage(e){

    if(e.gh === 'network') return 'GitHub could not be reached. Check the internet connection and try again. Nothing was published.';
    if(e.gh === 401) return 'The access key was not accepted. It may have expired: create a new one and save it under “Publishing settings”. Nothing was published.';
    if(e.gh === 403 || e.gh === 404) return 'The access key cannot write to ' + where + ' (branch ' + g.branch + '). Check the repository name, the branch and that the key has “Contents: Read and write”. Nothing was published.';
    if(e.gh === 409 || e.gh === 422) return 'The website file changed while publishing. Press Publish again.';

  /* ---------- logins: the admin block keeps, for each login, its table tag and its wrapping key (never the password) ---------- */
  var PASS_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
  function newPassword(){
    var out = '', n = PASS_ALPHABET.length, limit = 256 - (256 % n);

  async function credsFor(user, pass, onProgress){
    var secret = new TextEncoder().encode(user.trim().toLowerCase() + '\n' + pass);

    var c = {t: hex(bits.subarray(0, 16)), k: b64of(bits.slice(32, 64))};
    bits.fill(0); secret.fill(0);
    return c;
  }
  function recordOf(login){

  }
  function decoyTags(){ var real = {}; current.admin.logins.forEach(function(l){ real[l.t] = 1; }); return Object.keys(current.users).filter(function(t){ return !real[t]; }); }
  function evenDecoys(){   /* keep the table the same size, so it does not show how many logins exist */

  async function rotateScope(scope){

  async function addLogin(name, user, scope, onProgress){

  /* ---------- who handles each agent ---------- */
  var ASSIGN_HEAD = ['ClientID', 'Agent name', 'Client name', 'Category', 'Sales person', 'Accountant', 'Sales rep', 'Primary contact', 'Alternate contact'];
  function csvCell(v){ v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  function assignmentCsv(){
    var lines = [ASSIGN_HEAD.join(',')];
    current.data.agents.slice().sort(function(x, y){ return x.ac < y.ac ? -1 : x.ac > y.ac ? 1 : (x.a < y.a ? -1 : 1); }).forEach(function(a){
      lines.push([a.id, a.a || a.n, a.n, a.c, a.sp, a.ac, a.rep, a.m, a.c2].map(csvCell).join(','));
    });

  /* rows[0] is the header. A blank cell leaves that detail as it is; "Unassigned" clears a person, "-" clears a number. */
  function applyAssignments(rows){
    var key = function(s){ return clean(s).toLowerCase().replace(/[^a-z0-9]/g, ''); }, head = {};
    (rows[0] || []).forEach(function(h, i){ if(head[key(h)] === undefined) head[key(h)] = i; });
    var pick = function(){ for(var i = 0; i < arguments.length; i++) if(head[arguments[i]] !== undefined) return head[arguments[i]]; };
    var col = {id: pick('clientid', 'id'), sp: pick('salesperson', 'salesman'), ac: pick('accountant'), rep: pick('salesrep', 'salesrepresentative'),
      m: pick('primarycontact', 'primarycontactnumber', 'mobile', 'contact', 'contactnumber'), c2: pick('alternatecontact', 'alternatecontactnumber', 'altcontact', 'alternatenumber')};
    if(col.id === undefined) throw {assign: 'The sheet needs a “ClientID” column.'};
    if(['sp', 'ac', 'rep', 'm', 'c2'].every(function(f){ return col[f] === undefined; })) throw {assign: 'The sheet needs at least one of these columns: Sales person, Accountant, Sales rep, Primary contact, Alternate contact.'};
    var D = current.data, byId = {}, canon = {sp: {}, ac: {}, rep: {}};
    D.agents.forEach(function(a){ byId[a.id] = a; ['sp', 'ac', 'rep'].forEach(function(f){ canon[f][a[f].toLowerCase()] = a[f]; }); });
    var res = {agents: 0, sp: 0, ac: 0, rep: 0, contacts: 0, missing: 0, rows: 0};
    D.dir = D.dir || {};
    for(var r = 1; r < rows.length; r++){
      var id = clean(rows[r][col.id]); if(!id) continue;
      res.rows++;
      var a = byId[id]; if(!a){ res.missing++; continue; }
      var touched = false;

        var v = clean(rows[r][col[f]]); if(!v) return;

      });
      ['m', 'c2'].forEach(function(f){
        if(col[f] === undefined) return;
        var v = clean(rows[r][col[f]]); if(!v) return;

      });

        var carry = {}, known = {}, old = current.data.dir || {};

        current.data.agents.forEach(function(a){ carry[a.id] = {sp: a.sp, ac: a.ac, rep: a.rep, m: a.m, c2: a.c2}; known[a.id] = 1; });
        var out = CORE.compute(sheet, {carry: carry, known: known, file: file.name, uploaded: when(Date.now())});

  function publishPanel(){

    ['On GitHub, signed in as the owner of the website: Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token.',
     'Repository access: “Only select repositories”, then choose the website’s repository (' + (g.repo || 'the one holding this page') + ').',
     'Permissions → Repository permissions → Contents: “Read and write”. Nothing else is needed.',
     'Generate the token, copy it, paste it below and press Save.'].forEach(function(s){ steps.append(el('li', '', s)); });
    P.body.append(steps);
    var owner = textInput('gate-gh-owner', g.owner), repo = textInput('gate-gh-repo', g.repo), branch = textInput('gate-gh-branch', g.branch), path = textInput('gate-gh-path', g.path);
    var key = el('input'); key.type = 'password'; key.id = 'gate-gh-key'; key.autocomplete = 'off'; key.placeholder = g.token ? 'A key is in place · paste a new one to replace it' : 'Paste the access key';
    var remember = el('input'); remember.type = 'checkbox'; remember.id = 'gate-gh-remember'; remember.checked = saved || !g.token;
    var rl = el('label', 'gate-check'); rl.append(remember, ' Remember the key inside this website, encrypted so that only the admin login can open it. Leave unticked to type it at each visit.');
    var row = el('div', 'gate-form-row'); row.append(field('Owner', owner), field('Repository', repo), field('Branch', branch), field('File', path), field('Access key', key));
    var save = button('up-go', 'Save settings', 'gate-gh-save'), test = button('up-no', 'Test connection', 'gate-gh-test'), forget = button('up-no', 'Forget the key', 'gate-gh-forget'); forget.hidden = !g.token;
    var acts = el('div', 'up-acts'); acts.append(save, test, forget);
    var status = el('p', 'up-status'); status.id = 'gate-gh-status'; status.setAttribute('role', 'status');
    function say6(t, bad){ status.textContent = t || ''; status.classList.toggle('err', !!bad); }
    P.body.append(row, rl, acts, status);
    function read(){ return {owner: clean(owner.value), repo: clean(repo.value), branch: clean(branch.value) || 'gh-pages', path: clean(path.value).replace(/^\/+/, '') || 'index.html', token: key.value.trim() || g.token}; }
    save.addEventListener('click', function(){
      var v = read();
      if(!v.owner || !v.repo){ say6('Enter the owner and the repository.', true); return; }
      if(!v.token){ say6('Paste the access key.', true); key.focus(); return; }
      /* what would be written into the website: where it is stored, and the key only if it is to be remembered */
      var kept = function(){ var c = ghConfig(); return JSON.stringify([c.owner, c.repo, c.branch, c.path, (current.admin.gh && current.admin.gh.token) || '']); }, before = kept();
      current.admin.gh = {owner: v.owner, repo: v.repo, branch: v.branch, path: v.path};
      if(remember.checked){ current.admin.gh.token = v.token; current.ghToken = ''; } else current.ghToken = v.token;
      if(kept() !== before) markPending('publishing settings');
      current.pubNote = {text: remember.checked ? 'Publishing settings saved. The key is kept from your next publish onwards.' : 'Publishing settings saved for this visit.'};
      var n = publishPanel(); P.box.replaceWith(n); if(current.refreshPending) current.refreshPending();
    });
    test.addEventListener('click', async function(){
      var v = read();
      if(!v.owner || !v.repo || !v.token){ say6('Enter the owner, the repository and the access key first.', true); return; }
      say6('Checking…'); test.disabled = true;
      try {
        var canWrite = await ghTest(v);
        say6(canWrite === false ? 'The key can read ' + v.owner + '/' + v.repo + ' but cannot write to it. Give it “Contents: Read and write”.' : 'Connection works: ' + v.owner + '/' + v.repo + ', branch ' + v.branch + '.', canWrite === false);
      } catch(e){
        say6(e && e.gh === 401 ? 'The access key was not accepted.' : e && (e.gh === 403 || e.gh === 404) ? 'The key cannot see ' + v.owner + '/' + v.repo + ' or its branch ' + v.branch + '. Check the names and the key’s repository access.'
          : e && e.gh === 'network' ? 'GitHub could not be reached. Check the internet connection.' : 'GitHub answered with an error. Try again in a minute.', true);
      }
      test.disabled = false;
    });
    forget.addEventListener('click', function(){
      var had = !!(current.admin.gh && current.admin.gh.token);
      if(current.admin.gh) delete current.admin.gh.token;
      current.ghToken = '';
      if(had) markPending('access key removed');
      var n = publishPanel(); P.box.replaceWith(n);
    });
    return P.box;
  }

  function teardown(){
    try { if(window.Chart && Chart.instances) Object.keys(Chart.instances).forEach(function(k){ Chart.instances[k].destroy(); }); } catch(e){}
    app.replaceChildren();
  }

  function mount(){
    var rec = current.rec, data = current.data, n = data.agents.length;
    var tpl = document.createElement('template');
    tpl.innerHTML = n ? CORE.render(DASH_TPL, data.agents, data.label, data.meta)
      : '<div class="wrap"><div class="panel"><h2>No agents to show</h2><div class="hint">No agents are assigned to this login in the current data.</div></div></div>';
    app.replaceChildren(tpl.content);
    root.classList.remove('locked');
    gate.hidden = true;
    app.hidden = false;
    /* scripts set through innerHTML do not run; re-create each one, in order */
    Array.prototype.forEach.call(app.querySelectorAll('script'), function(old){
      var s = document.createElement('script');
      s.textContent = old.textContent;
      old.replaceWith(s);
    });
    var bar = document.createElement('div');
    bar.className = 'gate-session';
    var scope = document.createElement('span');
    scope.className = 'gate-scope' + (rec.r === 'accountant' ? ' limited' : '');
    scope.textContent = rec.r === 'admin' ? 'Admin · full access to all ' + n.toLocaleString() + ' agents'
      : rec.r === 'accountant' ? 'Accountant view · only your ' + n.toLocaleString() + ' agent' + (n === 1 ? '' : 's')
      : 'Full access · all ' + n.toLocaleString() + ' agents';
    var who = document.createElement('span');
    who.append('Signed in as ');
    var b = document.createElement('b'); b.textContent = rec.n; who.append(b);
    var out = document.createElement('button');
    out.type = 'button'; out.id = 'gate-signout'; out.textContent = 'Sign out';
    out.addEventListener('click', function(){ signOut(''); });
    bar.append(scope, who);
    var wrap = app.querySelector('.wrap') || app;
    wrap.insertBefore(bar, wrap.firstChild);
    var last = bar;
    if(current.admin) adminTools(bar).forEach(function(node){ last.after(node); last = node; });
    bar.append(out);
    
    current.theme = themeKey();
  }

  function signOut(note){
    
    current = null;
    teardown();
    app.hidden = true;
    gate.hidden = false;
    root.classList.add('locked');
    passInput.value = '';
    say(note || 'You are signed out.', true);
    window.scrollTo(0, 0);
    passInput.focus();
  }

  form.addEventListener('submit', async function(ev){
    ev.preventDefault();
    if(busy || !supported) return;
    if(readLock().until > Date.now()){ showLock(); return; }
    var user = userInput.value, pass = passInput.value;
    if(!user.trim()){ say('Enter your username.'); userInput.focus(); return; }
    if(!pass){ say('Enter your password.'); passInput.focus(); return; }
    busy = true; submit.disabled = true; submit.textContent = 'Checking…'; say('');
    var locked = false;
    try {
      if(!window.Chart) throw new Error('chart');
      var rec = await recordFor(user, pass, function(part){ submit.textContent = 'Checking… ' + Math.min(99, Math.round(part * 100)) + '%'; });
      submit.textContent = 'Opening…';
      var data = JSON.parse(await openBlock(rec.p));
      var admin = rec.a ? JSON.parse(await openBlock(rec.a)) : null;
      clearLock();
      passInput.value = '';
      current = {rec: rec, rec0: clone(rec), data: data, admin: admin, users: admin ? clone(USERS) : null, since: Date.now(), seen: {},
        ui: {}, pending: [], pubNote: null, secrets: [], ghToken: ''};
      
      lastActive = Date.now();
      mount();
      window.scrollTo(0, 0);
    } catch(e){
      if(e && e.message === 'credentials'){
        locked = recordFailure();
        
        if(!locked) say('That username or password is not right. Check both and try again.');
        passInput.select();
      } else if(e && e.message === 'chart'){
        say('The chart library did not load. Check the internet connection, reload the page and sign in again.');
      } else {
        current = null; teardown();
        say('The dashboard could not be opened in this browser. Reload the page and try again.');
      }
    } finally {
      busy = false; submit.textContent = 'Sign in';
      if(locked) showLock(); else submit.disabled = false;
    }
  });

  showBtn.addEventListener('click', function(){
    var reveal = passInput.type === 'password';
    passInput.type = reveal ? 'text' : 'password';
    showBtn.textContent = reveal ? 'Hide' : 'Show';
    showBtn.setAttribute('aria-pressed', String(reveal));
  });

  /* sign out after 15 minutes without activity */
  ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(function(t){
    document.addEventListener(t, function(){ lastActive = Date.now(); }, {passive: true, capture: true});
  });
  setInterval(function(){
    if(current && Date.now() - lastActive > IDLE_LIMIT_MS) signOut('Signed out after 15 minutes without activity. Sign in again to continue.');
  }, 20000);

  /* the charts take their colours from the theme, so redraw the dashboard when the theme changes */
  function themeKey(){ return getComputedStyle(root).getPropertyValue('--surface').trim(); }
  var themeTimer = null;
  function themeChanged(){
    clearTimeout(themeTimer);
    themeTimer = setTimeout(function(){
      if(current && current.theme !== themeKey()){ var y = window.scrollY; teardown(); mount(); window.scrollTo(0, y); }
    }, 120);
  }
  try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', themeChanged); } catch(e){}
  try { new MutationObserver(themeChanged).observe(root, {attributes: true, attributeFilter: ['data-theme']}); } catch(e){}

  document.getElementById('gate-eyebrow').textContent = META.label || '';
  
  if(supported && readLock().until > Date.now()) showLock();
})();
</script>

</body></html>
